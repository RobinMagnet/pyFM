name: lint

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          version: 0.15.22
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v1
        with:
          version: 0.15.22
          args: format --check
