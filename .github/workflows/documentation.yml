name: Documentation

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  release:

jobs:
  build_documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # setuptools_scm needs tags to compute the version

    # VTK's rendering libraries link against libGL at import time, and the
    # gallery renders PyVista scenes off-screen. Since VTK 9.5 the stock wheel
    # does headless rendering through EGL, so libegl1 is enough and no Xvfb is
    # needed. NB: libgl1-mesa-glx does not exist on ubuntu-24.04 (what
    # ubuntu-latest now resolves to) -- it is libgl1 + libglx-mesa0.
    - name: Install VTK runtime libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgl1 libegl1 libglx-mesa0 libxrender1

    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    # dev + docs come from [tool.uv] default-groups; viz via pyfmaps[viz].
    - name: Install dependencies from the lockfile
      run: uv sync --locked

    # -d keeps Sphinx's doctree cache out of the published directory. It defaults
    # to <outdir>/.doctrees, which means it gets deployed to the website: 12 MB of
    # build artifacts (61% of the push) plus an environment.pickle containing
    # absolute build paths.
    - name: Build HTML
      run: uv run sphinx-build -d docs/_build/doctrees -b html docs/source/ docs/_build/html

    - name: upload artifact
      uses: actions/upload-artifact@v4
      with:
        path:
          docs/_build/html/
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/master'
      with:
        publish_branch: gh-pages
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build/html
        force_orphan: true